<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Master Color Gradients -->
    <!-- Left Leg: Cyan to Deep Sapphire -->
    <linearGradient id="logo-ax-leg-left" x1="60" y1="18" x2="26" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="15%" stop-color="#00f0ff" />
      <stop offset="60%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#0033aa" />
    </linearGradient>

    <!-- Right Leg: Violet to Magenta and Amber -->
    <linearGradient id="logo-ax-leg-right" x1="60" y1="18" x2="94" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="20%" stop-color="#a855f7" />
      <stop offset="55%" stop-color="#ec4899" />
      <stop offset="85%" stop-color="#ff4500" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>

    <!-- Orbital Ring Front Tube -->
    <linearGradient id="logo-ax-ring-front" x1="16" y1="74" x2="104" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="55%" stop-color="#a855f7" />
      <stop offset="75%" stop-color="#ec4899" />
      <stop offset="90%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#ffaa00" />
    </linearGradient>

    <!-- Orbital Ring Back Tube -->
    <linearGradient id="logo-ax-ring-back" x1="104" y1="44" x2="16" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="40%" stop-color="#ff5500" />
      <stop offset="75%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>

    <!-- Core Star Radial Radiance -->
    <radialGradient id="logo-ax-core-radiance" cx="60" cy="58" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <!-- Wordmark Chromatic Gradient -->
    <linearGradient id="logo-wordmark-grad" x1="136" y1="52" x2="480" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="24%" stop-color="#38bdf8" />
      <stop offset="48%" stop-color="#c084fc" />
      <stop offset="68%" stop-color="#f472b6" />
      <stop offset="85%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="logo-sub-grad" x1="136" y1="92" x2="440" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Filters -->
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="logo-core-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b1" />
      <feGaussianBlur stdDeviation="1.5" result="b2" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="b2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== EMBLEM (Left: Center at 60, 60) ==================== -->
  <g id="emblem-group">
    <!-- Ambient Aura -->
    <circle cx="60" cy="60" r="48" fill="#00f0ff" opacity="0.12" filter="url(#logo-glow)" />
    <circle cx="68" cy="60" r="48" fill="#ff7700" opacity="0.10" filter="url(#logo-glow)" />

    <!-- Back Arc of Orbital Ring -->
    <g transform="rotate(-24 60 60)">
      <path d="M 104 60 A 44 12 0 0 0 16 60" stroke="url(#logo-ax-ring-back)" stroke-width="3.6" stroke-linecap="round" fill="none" opacity="0.85" />
      <path d="M 103 59.5 A 44 12 0 0 0 17 59.5" stroke="#ffe4e6" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.7" />
    </g>

    <!-- Master "A" Frame -->
    <!-- Left Leg Inner Facet -->
    <polygon points="60,18 60,36 44,74 35,82 31,85" fill="#0f172a" />
    <!-- Left Leg Outer Facet -->
    <polygon points="60,18 31,85 27,88 60,18" fill="url(#logo-ax-leg-left)" filter="url(#logo-glow)" />
    <polygon points="60,18 31,85 27,88 60,18" fill="url(#logo-ax-leg-left)" />

    <!-- Right Leg Inner Facet -->
    <polygon points="60,18 60,36 76,71 85,78 89,82" fill="#3b0764" />
    <!-- Right Leg Outer Facet -->
    <polygon points="60,18 89,82 93,85 60,18" fill="url(#logo-ax-leg-right)" filter="url(#logo-glow)" />
    <polygon points="60,18 89,82 93,85 60,18" fill="url(#logo-ax-leg-right)" />

    <!-- Center Ridge Spine Accents -->
    <line x1="60" y1="18" x2="31" y2="85" stroke="#e0f2fe" stroke-width="0.8" opacity="0.9" />
    <line x1="60" y1="18" x2="89" y2="82" stroke="#fed7aa" stroke-width="0.8" opacity="0.9" />

    <!-- Suspended 4-Point Sovereign Star -->
    <g filter="url(#logo-core-glow)">
      <circle cx="60" cy="58" r="11" fill="url(#logo-ax-core-radiance)" />
      <!-- Star Shape -->
      <path d="M 60 46 Q 58 55 50 58 Q 58 57 60 58 Q 62 57 70 58 Q 62 55 60 46 Z" fill="#ffffff" />
      <path d="M 50 58 Q 58 59 60 70 Q 58 61 60 58 Q 62 61 60 70 Q 62 59 70 58 Z" fill="#ffffff" />
      <circle cx="60" cy="58" r="1.5" fill="#ffffff" />
    </g>

    <!-- Front Arc of Orbital Ring -->
    <g transform="rotate(-24 60 60)">
      <path d="M 16 60 A 44 12 0 0 0 104 60" stroke="url(#logo-ax-ring-front)" stroke-width="4.2" stroke-linecap="round" fill="none" opacity="0.95" filter="url(#logo-glow)" />
      <path d="M 16 60 A 44 12 0 0 0 104 60" stroke="url(#logo-ax-ring-front)" stroke-width="3.4" stroke-linecap="round" fill="none" />
      <path d="M 18 59.4 A 44 12 0 0 0 102 59.4" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.85" />
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY: ASTRA✦NYX ==================== -->
  <g id="typography-group">
    <!-- Geometric Vector Wordmark: A S T R A ✦ N Y X -->
    <g stroke="url(#logo-wordmark-grad)" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Letter 'A' (1) - Sleek Lambda Chevron -->
      <path d="M 136 70 L 150 34 L 164 70" stroke-width="4.5" />

      <!-- Letter 'S' - Futuristic Smooth Flow -->
      <path d="M 197 40 C 197 34 177 32 177 42 C 177 53 198 51 198 62 C 198 72 176 71 176 64" stroke-width="4.2" />

      <!-- Letter 'T' -->
      <path d="M 209 34 L 233 34 M 221 34 L 221 70" stroke-width="4.4" />

      <!-- Letter 'R' -->
      <path d="M 244 70 L 244 34 L 258 34 C 267 34 267 48 258 48 L 244 48 M 256 48 L 268 70" stroke-width="4.3" />

      <!-- Letter 'A' (2) - Chevron -->
      <path d="M 278 70 L 292 34 L 306 70" stroke-width="4.5" />

      <!-- Letter 'O' / Core Star Glyph ✦ -->
      <g>
        <!-- Outer Glowing Ring -->
        <circle cx="330" cy="52" r="15" stroke-width="3.2" stroke="url(#logo-wordmark-grad)" />
        <!-- Inner 4-Point Star -->
        <path d="M 330 43 L 331.8 50.2 L 339 52 L 331.8 53.8 L 330 61 L 328.2 53.8 L 321 52 L 328.2 50.2 Z" fill="#ffffff" stroke="none" filter="url(#logo-core-glow)" />
      </g>

      <!-- Letter 'N' -->
      <path d="M 356 70 L 356 34 L 380 70 L 380 34" stroke-width="4.4" />

      <!-- Letter 'Y' -->
      <path d="M 392 34 L 404 50 L 416 34 M 404 50 L 404 70" stroke-width="4.4" />

      <!-- Letter 'X' -->
      <path d="M 428 34 L 452 70 M 452 34 L 428 70" stroke-width="4.5" />
    </g>

    <!-- Subtitle: SOVEREIGN COMMAND MATRIX -->
    <text x="136" y="92" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" font-weight="700" letter-spacing="4" fill="url(#logo-sub-grad)">
      SOVEREIGN COMMAND MATRIX
    </text>

    <!-- Subtle Grid Accent Lines -->
    <line x1="136" y1="78" x2="480" y2="78" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="488" cy="89" r="2.2" fill="#00f0ff" filter="url(#logo-glow)" />
    <circle cx="498" cy="89" r="1.5" fill="#f59e0b" opacity="0.8" />
  </g>
</svg>